<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Parking Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    a,
    a:focus,
    a:active,
    a:focus-visible {
      outline: none;
      box-shadow: none;
      border: none;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = "pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

    const carParks = [
      { name: "Main Parking",      coords: [-1.741681169995867, 53.400323549479204] },
      { name: "Alternative 1",     coords: [-1.7415555555555555, 53.398] },
      { name: "Alternative 2",     coords: [-1.7405602541940284, 53.3975013703475] },
      { name: "Alternative 3",     coords: [-1.7396111111111112, 53.396166666666666] },
      { name: "Alternative 4",     coords: [-1.7304308779114999, 53.39311015688274] }
    ];

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/satellite-streets-v12",
      center: carParks[0].coords,
      zoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl(), "top-right");
    map.addControl(new mapboxgl.NavigationControl(), "bottom-right");

    function popupHtml(name, coords) {
      return `
        <div style="font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.3">
          <div style="margin-bottom:4px">${name}</div>
          <a target="_blank" rel="noopener"
             href="https://www.google.com/maps/dir/?api=1&destination=${coords[1]},${coords[0]}">
            Directions
          </a>
        </div>
      `;
    }

    const markers = [];

    carParks.forEach((p) => {
      const popup = new mapboxgl.Popup({
        offset: 16,
        closeButton: false,
        closeOnClick: false
      }).setHTML(popupHtml(p.name, p.coords));

      const marker = new mapboxgl.Marker({
        color: "#EC2629",
        scale: 0.9
      })
        .setLngLat(p.coords)
        .setPopup(popup)
        .addTo(map);

      marker.getElement().addEventListener("click", () => {
        map.flyTo({ center: p.coords, zoom: 15, essential: true });
      });

      markers.push({ marker, popup });
    });

    map.on("load", () => {
      map.flyTo({ center: carParks[0].coords, zoom: 15, essential: true });
      markers[0].popup.addTo(map);
    });
  </script>
</body>
</html>
