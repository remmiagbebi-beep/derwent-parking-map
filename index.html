<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Parking Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; width: 100%; background: #000; }
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = "pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

    // Mapbox uses [lng, lat]
    const carParks = [
      { name: "Nearest Car Park", coords: [-1.741681169995867, 53.400323549479204] },
      { name: "Car Park 2",       coords: [-1.7415555555555555, 53.398] },                 // 53°23'52.8"N 1°44'29.6"W
      { name: "Car Park 3",       coords: [-1.7405602541940284, 53.3975013703475] },
      { name: "Car Park 4",       coords: [-1.7396111111111112, 53.396166666666666] },     // 53°23'46.2"N 1°44'22.6"W
      { name: "Car Park 5",       coords: [-1.7304308779114999, 53.39311015688274] }
    ];

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/satellite-streets-v12",
      center: carParks[0].coords,
      zoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl(), "top-right");
    map.addControl(new mapboxgl.NavigationControl(), "bottom-right");

    const markers = [];

    function makePopupHtml(name, coords) {
      const destination = `${coords[1]},${coords[0]}`;
      return `
        <div style="font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
          <div style="margin: 0 0 4px 0;">${name}</div>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${destination}"
             target="_blank" rel="noopener noreferrer">Directions</a>
        </div>
      `;
    }

    carParks.forEach((p) => {
      const popup = new mapboxgl.Popup({ offset: 18 }).setHTML(makePopupHtml(p.name, p.coords));

      const marker = new mapboxgl.Marker()
        .setLngLat(p.coords)
        .setPopup(popup)
        .addTo(map);

      markers.push({ marker, popup, data: p });

      marker.getElement().addEventListener("click", () => {
        map.flyTo({ center: p.coords, zoom: 15, essential: true });
      });
    });

    map.on("load", () => {
      map.flyTo({ center: carParks[0].coords, zoom: 15, essential: true });
      markers[0].popup.addTo(map);
    });
  </script>
</body>
</html>
